name: high_ai
description: "Offline AI chat powered by a locally-running Gemma model."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ai_engine:
    path: packages/ai_engine

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Local database
  drift: ^2.31.0
  drift_flutter: ^0.2.8

  # Model download
  dio: ^5.7.0
  crypto: ^3.0.6
  path_provider: ^2.1.5

  # Markdown + code rendering
  markdown: ^7.3.0
  flutter_highlight: ^0.7.0

  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  flutter_markdown_plus: ^1.0.12
  disk_space_plus: ^0.2.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.1
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true
